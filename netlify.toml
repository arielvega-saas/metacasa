# Configuración de deploy en Netlify — Home Finance web.
#
# Reemplaza al hosting de Vercel (el team quedó suspendido por facturación el
# 2026-07-28). Se eligió Netlify porque su plan gratuito PERMITE uso comercial,
# a diferencia del Hobby de Vercel, que es sólo para proyectos personales — y
# Home Finance cobra suscripciones.
#
# Es un monorepo: la web vive en `metacasa-web/`, por eso `base`.
#
# OJO con `publish`: se resuelve DISTINTO según quién construya, y es la diferencia
# que rompió el primer build automático (2026-08-03, "Failed Due To Plugin Error"):
#
#   - Build en Netlify (desde el repo): `publish` es relativo a `base`. El valor
#     correcto es `.next`.
#   - `netlify deploy --build` desde la máquina: lo resuelve contra la RAÍZ DEL REPO,
#     y ahí hay que escribir `metacasa-web/.next`.
#
# O sea que el valor que funciona en un modo falla en el otro, y el síntoma no se
# parece a un problema de rutas: con el valor equivocado el build de Next termina
# BIEN y lo que falla después es el plugin.
#
# Este archivo queda con el valor del CI, que es el camino normal ahora que el repo
# está conectado. Si alguna vez hay que deployear a mano, usar:
#   netlify deploy --build --prod --dir metacasa-web/.next

[build]
  base = "metacasa-web"
  command = "npm run build"
  publish = ".next"

  # NO construir cuando el commit no tocó la web.
  #
  # Esto es un MONOREPO: iOS, la web y el resto viven en el mismo repo, y
  # Netlify construye ante cualquier push salvo que se le diga lo contrario.
  # El 2026-08-08 se pusherarón 18 commits en un día y **sólo 2 tocaron la
  # web**: los otros 16 construyeron el mismo sitio idéntico, 16 veces.
  #
  # Con ~15 créditos por deploy sobre un plan de 300 al mes, eso son ~240
  # créditos tirados en un día — y es lo que agotó el ciclo y dejó los deploys
  # pausados justo cuando hacía falta publicar un cambio real.
  #
  # `ignore` invierte la lógica de los exit codes: **0 = cancelar el build**.
  # `git diff --quiet` devuelve 0 cuando NO hay diferencias, que es exactamente
  # el caso en que no hay nada que publicar.
  #
  # Se compara contra `netlify.toml` también: un cambio en la configuración del
  # deploy sí tiene que reconstruir, aunque no toque el código de la web.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

# Adaptador oficial de Next.js: traduce App Router, Server Actions, middleware
# y rutas dinámicas a funciones de Netlify. Netlify lo instala solo al detectar
# Next, pero declararlo evita sorpresas si cambia la autodetección.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # El proyecto usa Node 20+ (ver package.json). Sin fijarlo, Netlify puede
  # elegir una versión distinta a la local y romper el build por diferencias
  # de engine.
  NODE_VERSION = "20"

# El service worker (serwist) se genera en build como `public/sw.js` y NO debe
# quedar cacheado por el CDN: si el navegador se queda con un sw.js viejo,
# sigue sirviendo assets viejos aunque se publique una versión nueva.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# VARIABLES DE ENTORNO (se cargan en el panel de Netlify, NO acá — este archivo
# se versiona y no debe contener secretos). Lista COMPLETA, verificada con
# `grep process.env` sobre metacasa-web el 2026-07-31 — antes faltaban las de
# Mercado Pago y las wallets habrían fallado en silencio después del deploy.
#
# Públicas (viajan al browser, es correcto que sean visibles):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY   (publishable: es pública por diseño; la seguridad real es RLS)
#   NEXT_PUBLIC_APP_URL             (dominio final, ej. https://usehomefinance.com)
#   NEXT_PUBLIC_SITE_URL            (usado por robots.txt / sitemap / OG)
#   NEXT_PUBLIC_MP_OAUTH_CLIENT_ID  (client id de Mercado Pago; público por el flujo OAuth)
#
# Sólo servidor:
#   MP_OAUTH_CLIENT_ID
#   MP_OAUTH_REDIRECT_URI           (debe coincidir EXACTO con lo registrado en el panel de MP,
#                                    o MP rechaza con `invalid_redirect_uri`)
#
# NO va acá ni en Netlify: `MP_CLIENT_SECRET` vive sólo en la edge function de
# Supabase y no debe tocar nunca el cliente ni el build de la web.
