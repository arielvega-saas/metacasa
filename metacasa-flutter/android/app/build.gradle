plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Credenciales de firma release desde android/key.properties (gitignored, junto
// con upload-keystore.jks). Si el archivo no existe, el release cae a la debug
// key para que `flutter run --release` siga funcionando localmente sin el
// keystore. Para el AAB de producción, key.properties + el .jks deben existir.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.metacasa.metacasa"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // flutter_local_notifications 19.x requiere core library desugaring (java.time en API < 26).
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Application ID alineado con iOS (com.metacasa.app) para identidad de marca.
        applicationId = "com.metacasa.app"
        // minSdk 24 (Android 7.0): lo exige flutter_tts (voz del asistente); flutter_secure_storage
        // pedía 23. Cubre ~98% de devices activos.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Firma con el upload keystore si key.properties existe; si no, debug
            // (para `flutter run --release` local). El AAB de Play se firma con el
            // upload key y Play re-firma con el app-signing key (Play App Signing).
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
